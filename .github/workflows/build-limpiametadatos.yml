name: Build LimpiaMetadatos APK

on:
  push:
    branches:
      - apk-build-limpiametadatos
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: limpiametadatos-app
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        run: cp limpiametadatos-app/app/build/outputs/apk/debug/app-debug.apk LimpiaMetadatos.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LimpiaMetadatos-APK
          path: LimpiaMetadatos.apk
          if-no-files-found: error
